# A stationary bike ride, recorded as a ride that goes nowhere.
#
# The point of the app is one field in the file it writes. Record an indoor ride
# as plain cycling and every consumer downstream reads it as a bike ride that
# covered no ground: 45 minutes, 0.0 km, an average speed of zero, and a place in
# your distance totals it did not earn. The session here says sub_sport =
# indoor_cycling, which is the field that means the distance is absent because
# there was never any.
#
# On the watch it is the clock, your heart rate and the zone it puts you in, from
# a paired chest strap when one is connected and the wrist sensor when it is not
# -- and every record says which, so a ride can be read back knowing where its
# beats came from. Laps sum to the session, each with its own averages and time
# in zone, and a session with no lap at all is never written, since many FIT
# readers quietly drop one.
#
# The settings below are the parts a bike's own console knows and the watch does
# not. Zone floors can be given outright or left at zero to be spread evenly, and
# after a ride it can ask for the kilojoules the console reports and save them as
# work and average power -- the watch cannot measure either.
#
# Forked from Squash for its service half, which already had the indoor,
# GPS-free shape of an activity right, then given a Rust CustomGUI frontend.
#
# The history here starts at 0.5.2, which is the first version carrying the
# AppID UNA assigned. Everything before it -- 0.1.0 through 0.5.1 -- carried an
# id derived locally, which makes those builds a different app as far as the
# watch, the phone and this catalogue are concerned. They were never published
# here, so there is no watch that got one from Kira and nothing that a second,
# retired listing for that identity would help anybody recognise.
app_id     = "1B8D0B8FA049E33F"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "Spin"
folder     = "Spin"
licence    = "MIT"
maintainer = "tobymurray"

# Built against sdk-v1.4.0 rather than an apps release, and it has to be: the
# app reads its configuration through SDK::AppConfig, which landed in the SDK
# after apps-v1.4.0 shipped, so no apps release in existence can compile it.
# sdk-v1.4.0 is the library release that first carries it, it is the revision
# this app's own CI builds against, and it leaves the kernel interface where
# apps-v1.4.0 left it -- so these builds still need firmware 1.4 and no more.
[[versions]]
version = "0.5.2"
rev     = "38316cd777ae582eb50f580ed95aa9286b409ae2"
sdk_rev = "sdk-v1.4.0"
notes   = "First build under the AppID UNA assigned, and the app is already most of what it is now: an indoor ride written as indoor_cycling rather than as a bike ride that covered no ground, heart rate from a paired strap or the wrist with a field on every record saying which, any number of zones from two to eight drawn round the rim, and a ride that can be discarded. Earlier versions carried an id derived locally, were never published here, and are a different app to the watch."

[[versions]]
version = "0.5.3"
rev     = "89b0522362c5533f160dfd1afb47cb7120795fe8"
sdk_rev = "sdk-v1.4.0"
notes   = "Sizes the zone bucket array for the eight zones the dial supports, which is one more than it had room for."

[[versions]]
version = "0.6.0"
rev     = "f28145dc4392bef8df20d2680e988b9f78517100"
sdk_rev = "sdk-v1.4.0"
notes   = "Asks for the kilojoules the bike's console reports after a ride, and saves them as work and average power -- neither of which the watch can measure. The discard answers carry the weight the question deserves, and the watch icon is a spin bike rather than a penny-farthing."

[[versions]]
version = "0.6.1"
rev     = "b70bb957706b9e9bb250af2ff09c69c50bb380aa"
sdk_rev = "sdk-v1.4.0"
notes   = "Redraws the store icon, which was still a lone spoked wheel."

[[versions]]
version = "0.7.0"
rev     = "4db8289001f7611c44dcfd9c576c25577be4eba6"
sdk_rev = "sdk-v1.4.0"
notes   = "Draws every word and digit with TextKit's Poppins faces."

[[versions]]
version = "0.7.1"
