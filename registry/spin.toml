sdk_rev = "sdk-v1.4.0"
notes   = "Attributes zone seconds and calories to elapsed time rather than to ticks, so a ride whose ticks ran slow no longer reports less time in zone than it spent."

[[versions]]
version = "0.8.0"
rev     = "38d54fc28279ee6049f3f89a358103a447a5a6a7"
sdk_rev = "sdk-v1.4.0"
notes   = "Marks a lap with R2 while riding, so an interval can be read back afterwards with its own averages and time in zone."

[[versions]]
version = "0.9.0"
rev     = "d7962d47f6ce3df7d911339b7eee353bea222b69"
sdk_rev = "sdk-v1.4.0"
notes   = "Shows the split when a lap closes. With it, five fixes in the file the ride is saved as: the target is cleared before the commit rename, as FatFs requires; a saturating average power is kept off the uint16 that means invalid; the heart rate the FIT carries is rounded the way the shared log rounds it; and the session log line is stamped with when it happened."
