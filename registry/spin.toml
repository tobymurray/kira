# A stationary bike ride, recorded as a ride that goes nowhere.
#
# The point of the app is one field in the file it writes. Record an indoor ride
# as plain cycling and every consumer downstream reads it as a bike ride that
# covered no ground: 45 minutes, 0.0 km, an average speed of zero, and a place in
# your distance totals it did not earn. The session here says sub_sport =
# indoor_cycling, which is the field that means the distance is absent because
# there was never any.
#
# On the watch it is the clock, your heart rate and the zone it puts you in, from
# a paired chest strap when one is connected and the wrist sensor when it is not
# -- and every record says which, so a ride can be read back knowing where its
# beats came from. Laps sum to the session, each with its own averages and time
# in zone, and a session with no lap at all is never written, since many FIT
# readers quietly drop one.
#
# The settings below are the parts a bike's own console knows and the watch does
# not. Zone floors can be given outright or left at zero to be spread evenly, and
# after a ride it can ask for the kilojoules the console reports and save them as
# work and average power -- the watch cannot measure either.
#
# Forked from Squash for its service half, which already had the indoor,
# GPS-free shape of an activity right, then given a Rust CustomGUI frontend.
#
# The history here starts at 0.5.2, which is the first version carrying the
# AppID UNA assigned. Everything before it -- 0.1.0 through 0.5.1 -- carried an
# id derived locally, which makes those builds a different app as far as the
# watch, the phone and this catalogue are concerned. They were never published
# here, so there is no watch that got one from Kira and nothing that a second,
# retired listing for that identity would help anybody recognise.
app_id     = "1B8D0B8FA049E33F"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "Spin"
folder     = "Spin"
licence    = "MIT"
maintainer = "tobymurray"

# Each version names the SDK release its own CI built that tag against. The app
# reads its configuration through SDK::AppConfig, which landed after apps-v1.4.0
# shipped, so the earlier versions name sdk-v1.4.0, the library release that
# first carries it. The later ones name apps-v1.5.0, which carries it too and is
# where this app's CI moved on 2026-09-28. Both leave the kernel interface where
# apps-v1.4.0 left it, so every build here needs firmware 1.4 and no more.
[[versions]]
version = "0.5.2"
rev     = "38316cd777ae582eb50f580ed95aa9286b409ae2"
sdk_rev = "sdk-v1.4.0"
notes   = "First build under the AppID UNA assigned, and the app is already most of what it is now: an indoor ride written as indoor_cycling rather than as a bike ride that covered no ground, heart rate from a paired strap or the wrist with a field on every record saying which, any number of zones from two to eight drawn round the rim, and a ride that can be discarded. Earlier versions carried an id derived locally, were never published here, and are a different app to the watch."

[[versions]]
version = "0.5.3"
rev     = "89b0522362c5533f160dfd1afb47cb7120795fe8"
sdk_rev = "sdk-v1.4.0"
notes   = "Sizes the zone bucket array for the eight zones the dial supports, which is one more than it had room for."

[[versions]]
version = "0.6.0"
rev     = "f28145dc4392bef8df20d2680e988b9f78517100"
sdk_rev = "sdk-v1.4.0"
notes   = "Asks for the kilojoules the bike's console reports after a ride, and saves them as work and average power -- neither of which the watch can measure. The discard answers carry the weight the question deserves, and the watch icon is a spin bike rather than a penny-farthing."

[[versions]]
version = "0.6.1"
rev     = "b70bb957706b9e9bb250af2ff09c69c50bb380aa"
sdk_rev = "sdk-v1.4.0"
notes   = "Redraws the store icon, which was still a lone spoked wheel."

[[versions]]
version = "0.7.0"
rev     = "4db8289001f7611c44dcfd9c576c25577be4eba6"
sdk_rev = "sdk-v1.4.0"
notes   = "Draws every word and digit with TextKit's Poppins faces."

[[versions]]
version = "0.7.1"
rev     = "c542c1ebd8ec3d8c8025d82018cf8e3496ab6b54"
sdk_rev = "sdk-v1.4.0"
notes   = "Attributes zone seconds and calories to elapsed time rather than to ticks, so a ride whose ticks ran slow no longer reports less time in zone than it spent."

[[versions]]
version = "0.8.0"
rev     = "38d54fc28279ee6049f3f89a358103a447a5a6a7"
sdk_rev = "sdk-v1.4.0"
notes   = "Marks a lap with R2 while riding, so an interval can be read back afterwards with its own averages and time in zone."

[[versions]]
version = "0.9.0"
rev     = "d7962d47f6ce3df7d911339b7eee353bea222b69"
sdk_rev = "sdk-v1.4.0"
notes   = "Shows the split when a lap closes. With it, five fixes in the file the ride is saved as: the target is cleared before the commit rename, as FatFs requires; a saturating average power is kept off the uint16 that means invalid; the heart rate the FIT carries is rounded the way the shared log rounds it; and the session log line is stamped with when it happened."

[[versions]]
version = "0.9.1"
rev     = "c939772f691049481ad17b605552c94177abc236"
sdk_rev = "sdk-v1.4.0"
notes   = "Checks the FIT writer's allocation before the ride depends on it. A heap that could not spare 92 bytes mid-ride was a store through null, a HardFault and a lost activity."

[[versions]]
version = "0.10.0"
rev     = "4df9890342d3be381df66088efb8b9e5a1cfe59b"
sdk_rev = "sdk-v1.4.0"
notes   = "Shrinks the panic handler, whose message was 78% of it. Nothing a wearer sees changes."

[[versions]]
version = "0.12.0"
rev     = "98ffe359d1db70871b095033be78641978fb19db"
sdk_rev = "sdk-v1.4.0"
notes   = "Reorganises the shared graphics crates and takes the panel's own rule for which pixels are on the glass. Nothing a wearer sees changes."

[[versions]]
version = "0.13.0"
rev     = "7269ffb1d3fb299f3e1052f2e2f8359ddb5cddf4"
sdk_rev = "sdk-v1.4.0"
notes   = "Moves the panel's colour decoding into the shared crate that owns the palette. Nothing a wearer sees changes."

[[versions]]
version = "0.14.0"
rev     = "dba656328887ff6f3790655bb04dc50dc710dfab"
sdk_rev = "sdk-v1.4.0"
notes   = "Interval sessions, declared as one string in the settings form: a buzz and an automatic lap at every step boundary, and a word on screen for how hard the step just entered is meant to be. That word is an instruction, never a compliance check, so nothing compares it with your heart rate. Avoid this build: saving a ride overflows the Service stack and faults the watch. The ride itself survives, but its line in the shared session log is lost. Fixed in 0.14.2."

[[versions]]
version = "0.14.1"
rev     = "bb758617282b25c73f92b7ced969822cbfe3a397"
sdk_rev = "apps-v1.5.0"
notes   = "Built against upstream apps-v1.5.0 instead of a forked SDK. Like 0.14.0, saving a ride still faults the watch; fixed in 0.14.2."

[[versions]]
version = "0.14.2"
rev     = "ab8a4aa9b3914e1ab700b1d9705b503124d60ecf"
sdk_rev = "apps-v1.5.0"
notes   = "Saving a ride no longer faults the watch. In 0.14.0 and 0.14.1 every save overflowed the Service stack after the .fit and summary were written, so the ride survived and only its line in the shared session log was lost. Proven on firmware 1.5.0, where the save path now measures 2,064 bytes against a 10,240-byte stack."
