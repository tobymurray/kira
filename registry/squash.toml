# A squash session, and the raw motion recorder it is being built out of.
#
# The activity half is ordinary and finished: the clock, your heart rate and the
# zone it puts you in, laps, and a FIT file whose session says squash rather than
# a workout that covered no ground. A paired chest strap is used when one is
# connected and the wrist sensor when it is not.
#
# The other half is why it exists. Counting shots needs labelled court data, and
# there is none -- so rather than shipping a detector tuned on nothing, the app
# ships the means to collect the data: a switch that streams the wrist sensor's
# raw 100 Hz motion to a CSV beside the activity, in a format the SDK's simulator
# replays. It fills flash fast and stops itself at 8 MB or 30 minutes, whichever
# comes first, so it is off unless somebody turns it on.
#
# The previous listing for this app, under a locally derived AppID rather than the
# one UNA registered, is registry/squash-old-id.toml. A watch carrying that 0.1.0
# is carrying a different app as far as the kernel is concerned; installing this
# one replaces what is in Apps/Squash/.
#
# The history here starts at 0.5.0, which is the first version carrying the
# registered id and the first with a manifest and a CI build of its own.
app_id     = "9E526672EAFB61B6"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "Squash"
folder     = "Squash"
licence    = "MIT"
maintainer = "tobymurray"

# Built against sdk-v1.4.0 rather than an apps release, and it has to be: the
# app reads its configuration through SDK::AppConfig, which landed in the SDK
# after apps-v1.4.0 shipped, so no apps release in existence can compile it.
# sdk-v1.4.0 is the library release that first carries it, it is the revision
# this app's own CI builds against, and it leaves the kernel interface where
# apps-v1.4.0 left it -- so these builds still need firmware 1.4 and no more.
[[versions]]
version = "0.5.0"
rev     = "c8331291151028dafa57673aafd922587434aee7"
sdk_rev = "sdk-v1.4.0"
notes   = "First published build. A squash session recorded as FIT with sport=racket and sub_sport=squash, on the Workout app's session handling: heart rate and zones, calories, laps, crash recovery. Its recording flag is read through SDK::AppConfig from the app's own declaration, which is where the form on this card comes from, and it has an icon of its own rather than the stock figure. It does not detect shots; what it ships is the recorder that collects the data for tuning that."

[[versions]]
version = "0.6.0"
rev     = "0307738997d0c8a36fa9352c17ead2d612257465"
sdk_rev = "sdk-v1.4.0"
notes   = "Laps are declared as supported, having turned out to be reachable, and pressing one during a research recording writes a marker into the CSV -- which is what makes a labelled session possible at all. Built against 1.4 and will not launch on a 1.3 kernel."
