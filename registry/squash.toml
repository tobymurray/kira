# A squash activity app, and the raw 100 Hz IMU recorder it is being built out
# of: shot detection needs labelled court data that does not exist yet, so the
# app ships the means to collect it before anything derived from it.
app_id     = "A1E5C38B7D2F9046"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "Squash"
folder     = "Squash"
licence    = "MIT"
maintainer = "tobymurray"

# The recorder is off unless this file says otherwise, and there is no on-watch
# toggle for it — four buttons and no keyboard. The app owns the name, the schema
# and the key, and validates the value again itself, falling back to off.
#
# There is no checkbox field type, so the flag is a word. The app accepts
# on/yes/true/1/enabled in any case and treats everything else as off, which is
# the safe direction for something whose only effect is to start filling flash.
[config]
file   = "input.json"
schema = 1

[[config.fields]]
path      = "values.record_imu"
title     = "Record raw IMU"
help      = "Type on to stream the raw 100 Hz accelerometer and gyroscope to a CSV alongside each activity, for tuning shot detection later. Costs about 4.3 KiB per second and stops itself at 8 MB or 30 minutes. Leave blank or type off for a normal session."
maxLength = 8

[[versions]]
version = "1.0.0"
rev     = "90991fab1388630a16bb3dd1d0bf77e3129b0ad8"
sdk_rev = "apps-v1.3.0"
retired = "the recorder cannot be switched on: 1.0.0 reads the flag from settings.json, which an install has no copy of and the app overwrites whole. 0.1.0 reads input.json. Recorded activities stay valid FIT."
notes   = "First build. Squash sessions recorded as FIT with sport=racket and sub_sport=squash, on the Workout app's session handling — HR and zones, calories, laps, crash recovery. It does not detect shots or count rallies: those need labelled squash recordings that do not exist yet, so what ships instead is the recorder that collects them, streaming the raw 100 Hz IMU to CSV in a format the SDK simulator can replay. That is off by default and there is no on-watch toggle for it. Untested on hardware."

[[versions]]
version = "0.1.0"
rev     = "49130de567edfb7ed78a338693ace5d884c3ebcd"
sdk_rev = "apps-v1.3.0"
notes   = "The first version that works. 1.0.0 took its flag from the app's own settings.json, a file a fresh install does not have and one the app rewrites whole on every settings change, so on an installed copy the recorder could not be switched on at all, and nothing said so. It now comes from input.json, which the tick box on this card writes. Numbered below 1.0.0 deliberately: nothing here is exposed to a user yet beyond the Workout screens it was cloned from."
