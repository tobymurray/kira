# A parkrun-style Code 128 barcode for an athlete id the user supplies, read from
# a JSON file written into the app's own folder over USB.
app_id     = "865E8CB21BF7E1ED"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "Barcode"
folder     = "Barcode"
licence    = "MIT"
maintainer = "tobymurray"

# The app reads its athlete id out of a file in its own folder, because the watch
# has no keyboard to type one on. Kira fills that file in over USB. The app owns
# the name, the schema number and the key; it validates the value again itself.
[config]
file   = "input.json"
schema = 1

[[config.fields]]
path      = "values.id"
title     = "Athlete id"
help      = "The characters printed under the barcode on your parkrun card, e.g. A1234567."
maxLength = 16

[[versions]]
version = "0.1.0"
rev     = "2c0d6d89210ac51f91fef4fdf11c7a25cd8c8d94"
sdk_rev = "apps-v1.3.0"
notes   = "First build. Draws a Code 128 barcode for an id read from Apps/Barcode/input.json, which you write over USB — nothing is compiled in, so a fresh install tells you what to write rather than showing a placeholder that would scan as somebody else's number."
