# Measures whether an all-night app is possible on this watch at all.
#
# Nothing on this device has ever run for eight hours. Every app in the
# catalogue is either foreground-interactive or a background task measured in
# minutes, so whether a service keeps its sensor subscriptions, its file handles
# and its battery across a night is simply unmeasured -- and a sleep app that
# finds out in month two that its sensors stopped at 02:00 has wasted month one.
#
# So this subscribes every candidate sensor, counts what actually arrives, and
# appends one line a minute. It computes nothing and decides nothing. The
# reading is done afterwards on a computer, by a script in the same repository,
# where it can be re-run against the same night as the questions change.
#
# Eight questions, each a column: does delivery survive the whole night, and
# where does it stop if not; what does continuous optical heart rate cost;
# what is the *delivered* sample rate as opposed to the requested one; does
# SpO2 produce a single sample; does HEART_BEAT still emit nothing; does
# worn-detection hold on a loosely-strapped sleeping wrist or flicker; does
# anything else contend for the heart-rate sensor; and how fast can the volume
# be appended to.
#
# Run it unplugged and worn -- plugging in stops every app on the watch, so a
# night on the charger records nothing. Two nights answer most of it: one with
# heart rate on, one with it off, and the difference is what heart rate costs.
# A third on a nightstand answers the rest.
#
# It has a screen showing which sensors resolved and how many rows have been
# written, for the thirty seconds before bed when the only question is whether
# this is going to record anything. It cannot be stopped from the watch: delete
# the folder when you are done with it. That is the right trade for a
# diagnostic whose whole job is to still be running at 04:00.
#
# A tool, not a product. It produces a CSV that means nothing without the
# report script, and it is deliberately uninteresting to anyone not building
# something that has to run all night.
app_id     = "999A630E7F105A07"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "SleepLab/Probe"
folder     = "SleepProbe"
licence    = "MIT"
maintainer = "tobymurray"

# Every field is optional and the app records a useful night with no file at
# all -- the defaults are the most informative run, not the cheapest, because a
# first night with everything subscribed answers the most questions. What it
# reads is probe.json in its own folder.
#
# There is no form for it on the card any more. A settings form now comes out of
# the app's own `app-manifest.json`, read at the commit the binary was built
# from, so it is part of the recipe rather than a claim made in this file, and
# the Probe has no manifest yet.
#
# What the declaration should say, when it is written: `hr` as a string with a
# pattern of `(?:[Cc]ontinuous|[Oo]ff|[Dd]uty)` and a default of `continuous`;
# `hr_duty_on_sec` and `hr_duty_per_sec` as ints defaulting to 60 and 300;
# `accel_period_ms` and `accel_latency_ms` as ints defaulting to 40 and 5000; and
# `spo2` and `ppg` as bools defaulting to on and off. Four of those are typed
# words here only because this convention had no other type -- the SDK's model
# has bools and bounded ints, so the range checks the app repeats on the watch
# would be in the declaration where the form can enforce them, and a rate nobody
# chose could not be typed in the first place.
#
[[versions]]
version = "0.1.0"
rev     = "9b37dbf45d80dc23192bf1d639ecf351590198ac"
sdk_rev = "apps-v1.4.0"
notes   = "First build. Subscribes every candidate sensor -- accelerometer, worn-detection, motion, heart rate and its multi-source variant, beat events, PPG, SpO2, steps, battery -- and appends one row a minute of delivered sample counts, worn transitions, both clocks and battery state. A missing measurement is written -1, never 0: a sensor that delivered nothing is a finding, one never subscribed is not. Analysis is a script in the same repo. Not tested on hardware; testing on hardware is what it is for."

[[versions]]
version = "0.1.1"
rev     = "53cbe141a429d9429be36b427824b8c6f504be51"
sdk_rev = "apps-v1.4.0"
notes   = "Distinguishes a sensor the config never asked for from one it asked for and the firmware refused -- a dot against a lower-case letter, where both used to read the same. Prompted by the first hardware run: SpO2, beat events and PPG all fail to resolve a driver at all on 1.4, which the old screen showed the same way as a sensor simply switched off. Recording is unchanged; the log already told these apart."
