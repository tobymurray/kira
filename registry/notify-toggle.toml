# One switch, for the watch-wide phone-notification setting.
#
# It flips the real thing rather than a copy of it: the phone.notifications flag
# the paired UNA phone app edits, which is watch-wide and not a per-app
# capability. The change applies at once.
#
# Making it *last* is the interesting part, and it is why the app has a setting of
# its own. No app-facing message can read or write this flag -- the SDK's
# RequestSystemSettings payload does not carry the phone group at all, and there
# is no setter anywhere -- and the sandboxed filesystem API cannot reach
# settings.json either. So persistence means splicing the file directly, on
# addresses derived by reverse-engineering one watch on one firmware version. The
# app therefore proves the firmware before it touches anything, and says on
# screen when a change will not last instead of claiming one that would not.
#
# That is what the switch below is: saving is off by default, and turning it on
# is a decision, not a convenience. It needs watch software 1.4.0 exactly; on any
# other version the app refuses and says so. The floor the phone checks is a
# minimum rather than an exact match, so a newer watch can install this and meet
# a screen telling it the app will not act.
#
# The history here starts at 0.4.0, the first version carrying the AppID UNA
# assigned. 0.2.0 to 0.3.0 carried a locally derived id, which makes them a
# different app to the watch; they were never published here, so nothing is left
# unrecognised by leaving them out.
app_id     = "26FBAA925F61BA27"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "NotifyToggle"
folder     = "NotifyToggle"
licence    = "MIT"
maintainer = "tobymurray"

# Built against sdk-v1.4.0 rather than an apps release, and it has to be: the
# app reads its configuration through SDK::AppConfig, which landed in the SDK
# after apps-v1.4.0 shipped, so no apps release in existence can compile it.
# sdk-v1.4.0 is the library release that first carries it, it is the revision
# this app's own CI builds against, and it leaves the kernel interface where
# apps-v1.4.0 left it -- so these builds still need firmware 1.4 and no more.
[[versions]]
version = "0.4.0"
rev     = "98d68dca76257df37292b05a61e7431ee8e7d7f7"
sdk_rev = "sdk-v1.4.0"
notes   = "First published build. One switch for the watch-wide phone-notification setting -- the real flag the paired phone app edits, not a per-app capability -- taking effect at once. Turning on Save to watch settings splices it into the watch's own settings.json so it survives a restart, and the app proves the firmware first and says on screen when a change will not last. The splice is scoped to phone.notifications and tested. Earlier versions carried a locally derived id and were never published here."

