# What the sun is going to do next, on one card.
#
# A glance answers one question, so this one does: the next event and how long
# until it -- "sunrise 04:50, in 1h12m, sets 19:17" -- rather than a table of
# today's two times, which is a screen you would have to open.
#
# It knows where it is because you tell it once, in the two boxes below, and
# that is a better fit for the question than a GNSS fix would be. Sunrise moves
# about four minutes per degree of longitude, so a position good to 25 km is
# good to under a minute; 25 km is "which town". A cold fix, meanwhile, takes
# tens of seconds and real battery, and the carousel stops a glance's service
# the moment you scroll past -- so a card that tried to locate itself would
# spend the power and still show nothing. A coordinate typed in February is
# also exactly as correct in August: the date is an input, not part of the
# position.
#
# What it will not do is guess. With no position it shows two dashes and says
# so, because the default in a pair of unset coordinates is (0, 0) -- the Gulf
# of Guinea, where the sun rises at about six all year round and the screen
# looks perfectly healthy. Above the Arctic circle it says "midnight sun" or
# "polar night" rather than inventing a time for a day that has neither. And if
# the watch's time zone stops matching the position -- you flew somewhere, the
# clock followed, the coordinates did not -- the caption changes to "times are
# for home", which is the one failure no other part of the app could notice.
#
# There is no screen behind it. Tapping the card opens nothing: everything the
# app has to say is three lines, which is what a glance is for.
app_id     = "CCAC55621745C147"
source     = "https://github.com/tobymurray/watch-apps"
subdir     = "SunGlance"
folder     = "Sun"
licence    = "MIT"
maintainer = "tobymurray"

# The two coordinates come out of input.json in the app's own folder, and the
# card has no form for them any more. The reason is worth recording, because this
# app is the one it costs the most: a settings form now comes out of the app's
# own `app-manifest.json`, read at the commit the binary was built from, so it is
# part of the recipe rather than a claim made in this file -- and SunGlance has
# no manifest yet. Until it does, the file has to be written by hand, and the
# card says nothing about it, which for an app that shows two dashes without one
# is the worst place for this gap to fall.
#
# What the declaration should say, when it is written: two required `float`
# fields, `lat` and `lon`, with min/max of -90..90 and -180..180 and a unit of
# `deg`. The file that reaches the watch is unchanged by the move -- Kira's old
# convention wrote `values.lat` into the same envelope the SDK specifies, so a
# field id of `lat` produces exactly the same document, and a watch already
# carrying one keeps working.
#
# Typing them is also easier under the SDK's model than it was here. This form
# was two text boxes and the app was deliberately fussy about what went in them:
# "45,4215" with a decimal comma, "45.4215N" with a compass letter and
# degrees-minutes-seconds were all refused, because a reader lenient enough to
# accept them would turn the first into 45 and throw away a hemisphere in the
# second. A declared `float` field is a number to the form, the bounds are the
# app's own, and none of those three can be entered in the first place.
#
[[versions]]
version = "0.1.0"
rev     = "cfada78867c05253c0a554582f79d54ee20697b9"
sdk_rev = "apps-v1.4.0"
notes   = "First build. Shows the next sun event and the countdown to it, from a latitude and longitude you set here; nothing is compiled in. The arithmetic is NOAA's, checked against an independent implementation over 107 place-days: worst disagreement 26 s below 55 degrees of latitude, 118 s nearer the poles. Polar days are reported as themselves rather than as a missing time. Not run on a watch yet -- 64 host tests and no panel, so expect a caption a character too wide."

[[versions]]
version = "0.2.0"
rev     = "ffdef14da33e6d269149de66250c469e407a050d"
sdk_rev = "apps-v1.4.0"
notes   = "Both upcoming events at once, an icon and a time each, in the order they happen -- so once today's sunrise has been, the second row is tomorrow's, and nothing on the card is in the past. The icons replace the words sunrise and sunset, which were spending a third of the panel saying what a picture says, and the caption is now just the countdown. On a kernel that will not grant five controls the words come back instead. Still not run on a watch."

[[versions]]
version = "0.3.0"
rev     = "b43828b5a4fb0bac1e8ad382404fd7c5c28e7c4b"
sdk_rev = "apps-v1.4.0"
notes   = "Both times side by side now -- left is what happens next, right is the one after it, with the countdown under them. That is also the fix for a clipped bottom row in 0.2.0: stacking made height the binding constraint on a panel that is wide and short, and the font was a size too big for the band holding it. Nothing is positioned by hand any more. The arrangement, the font and every box are worked out from the area the kernel reports, which the app now writes to glance.txt."

[[versions]]
version = "0.3.1"
rev     = "32673c9757cbf78ea989e8ff440fa2b07d952719"
sdk_rev = "apps-v1.4.0"
notes   = "Keeps the left icon clear of the scroll indicator the carousel paints over the glance, which was clipping its edge in 0.3.0. The app reports the glance area to glance.txt and a watch says 240x60 -- so everything but the caption is now inset 18 pixels from the left, and the gaps between icon and time came in to keep the same font size inside the narrower usable width. Same two times, same font, nothing under the bar."
