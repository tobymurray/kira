name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler and pulls in clippy, rustfmt and
      # the wasm target, so there is nothing to configure here.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The browser crate only compiles for wasm, so it needs its own pass.
      - run: cargo clippy -p kira-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace

      # Prove the catalogue builds from real releases, not just that units pass.
      # Two releases, so multi-release grouping and the changed/re-stamp
      # annotation are both exercised rather than just the single-release path.
      - name: Build against the two newest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate repos/UNAWatch/una-sdk/releases \
            --jq '.[]
                  | select(.prerelease == false)
                  | select(.tag_name | startswith("apps-v"))
                  | {tag: .tag_name, publishedAt: .published_at, url: .html_url,
                     isPrerelease: .prerelease, notes: .body}' \
            | jq -s 'sort_by(.publishedAt) | reverse | .[:2]' > releases.json

          # See catalog.yml for why: the asset endpoint 500s often enough that
          # one try is not a test of anything.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              # Guarded rather than bare, so a false test is not the loop body's
              # exit status under `set -e`.
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
            done
            return 1
          }

          mkdir -p apps
          for tag in $(jq -r '.[].tag' releases.json); do
            mkdir -p "zips/$tag" "apps/$tag"
            retry gh release download "$tag" -R UNAWatch/una-sdk -D "zips/$tag" --clobber
            unzip -q "$(find "zips/$tag" -name '*.zip' | head -n 1)" -d "apps/$tag"
          done

          # --registry against an empty store: nothing is built here, so no
          # submission can be published, but the checks that run at every
          # catalogue build do run -- including the identity collisions between
          # the live registry and the two newest upstream releases.
          mkdir -p empty-store
          cargo run --release -p kira-cli -- build \
            --src apps --out site --releases releases.json --repo UNAWatch/una-sdk \
            --registry registry --built empty-store --toolchain unpinned

          test -s site/data/catalog.json
          # Deliberately hardcoded: a schema bump should require updating this.
          jq -e '.schema == 8 and (.releases | length) == 2' site/data/catalog.json > /dev/null
          # Provenance must actually be populated, not just declared in the types.
          jq -e '[.apps[].versions[] | select(.origin == null)] | length == 0' \
            site/data/catalog.json > /dev/null
          jq -e '[.apps[] | select((.versions | length) > 1)] | length > 0' \
            site/data/catalog.json > /dev/null
          echo "$(jq '.apps | length' site/data/catalog.json) apps with history"

      # The fixture-backed planner test needs two unzipped releases, which the
      # step above just produced.
      - name: Planner check across those two releases
        run: |
          set -euo pipefail
          new=$(jq -r '.[0].tag' releases.json)
          old=$(jq -r '.[1].tag' releases.json)
          # Absolute: cargo runs a test binary with the crate directory as its
          # working directory, not the workspace root.
          KIRA_FIXTURE_NEW="$PWD/apps/$new" KIRA_FIXTURE_OLD="$PWD/apps/$old" \
            cargo test -p kira-core --test release_diff -- --nocapture
