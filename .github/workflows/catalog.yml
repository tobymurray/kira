name: Catalogue

# Rebuilds the catalogue and publishes the site to GitHub Pages. Nothing is
# compiled here: app-binaries.yml builds every SDK app and registry.yml builds
# every submission, both into the app-binaries store, and this run reads that
# store back. Upstream's own release zips are still downloaded, because a
# version with no Kira build falls back to the vendor's binary and because their
# binaries are what `matchesUpstream` is compared against.
#
# Every published apps-v* release is included, not just the newest, because
# upstream offers no way to fetch a specific older build.

on:
  push:
    branches: [main]
    # What Submissions runs on, mirrored. A push touching these gets a catalogue
    # build from the workflow_run trigger below instead, once the app it added
    # is actually in the store -- so running here as well would build a
    # catalogue deliberately missing the app that was just merged, then throw it
    # away three minutes later.
    #
    # It also stops the two runs racing. Both carry the same commit, and the
    # `pages` group below replaces the older one; when that lands while its
    # deploy job is mid-poll, the Pages deployment it created goes to `error`,
    # and the successor's deployment -- same commit, so the same
    # `pages_build_version` -- comes back "Deployment cancelled". That is how
    # merging #49 published nothing. It needed the push run's deploy to still be
    # in flight 2m46s in, which is why the three registry merges before it were
    # fine: their deploys finished inside 1m40 and there was nothing to cancel.
    #
    # A push touching one of these *and* something else still runs both, since
    # `paths-ignore` skips only when every changed path matches -- so the race is
    # narrowed to a shape no submission has: registry/README.md says a submission
    # is one `registry/<slug>.toml` and nothing else.
    paths-ignore:
      - 'registry/**'
      - '.github/workflows/registry.yml'
  # A merged submission builds and uploads to the store in its own workflow,
  # which finishes after a push run here would have read the store. This is the
  # rebuild that publishes it, and now the only one for such a push.
  #
  # The cost is that a registry change whose Submissions run *fails* gets no
  # catalogue build at all, where it used to get one that published nothing new.
  # That matters only for a change with no binary behind it -- withdrawing a
  # version, say -- which then waits for the daily cron rather than publishing at
  # once. A day late on a retirement, against a deploy that fails outright.
  workflow_run:
    workflows: [Submissions]
    types: [completed]
    branches: [main]
  schedule:
    # Daily, to pick up a new apps-v* release without a manual nudge.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish only this apps-v* tag (blank = every published release)'
        required: false
        default: ''
      max_releases:
        description: 'Cap how many releases to include, newest first (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Must match what the app-binaries workflow built with: the digest is part of
  # every recipe, so a mismatch means no artifact is found and everything falls
  # back to upstream's binaries.
  TOOLCHAIN: ghcr.io/tobymurray/kira-toolchain@sha256:4d75a70b33b4c4fb8799bed5af2ebb03c9b6eb161ffed3049e316ad996461127
  BINARIES_TAG: app-binaries

# Supersede rather than queue. This build derives everything it publishes from
# upstream's releases and the binary store, writes nothing persistent of its own,
# and deploys the whole site at once -- so two runs back to back produce the same
# result and the second only waits for the first. There is no incremental work
# queueing would protect.
#
# Queueing also had no way out of a stall. A Pages deployment left without a status
# by an Actions outage held the github-pages environment, its deploy job sat
# `queued` for thirteen hours, and every later run -- including the daily cron --
# piled up behind it, so a newly merged app could not publish at all. Waiting does
# not fix that; being replaced does.
#
# Not a timeout: the deploy job had already run 780 minutes against a 360-minute
# default without being cancelled, so time spent waiting on an environment does not
# count towards `timeout-minutes` and no value there would have helped.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A failed submission run leaves the store as it was, so there is nothing new
    # to publish and no reason to redeploy.
    #
    # The head_repository test is what makes the `branches: [main]` filter above
    # mean what it looks like it means. That filter matches the *triggering run's*
    # head branch, and for a pull request from a fork that is the fork's branch
    # name -- which is very often `main`. So an outsider opening a pull request
    # could set a full catalogue rebuild and Pages deploy going. It would deploy
    # this repository's own content, so nothing false could be published; it is a
    # stranger being able to start the machinery that is wrong.
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    outputs:
      releases: ${{ steps.fetch.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler and pulls in the wasm target.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace

      - name: Build the browser module
        run: |
          set -euo pipefail
          # wasm-bindgen-cli must match the wasm-bindgen crate exactly, so the
          # version comes from the lockfile rather than being pinned by hand.
          want=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n 1)
          have=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)
          if [ "$want" != "$have" ]; then
            echo "installing wasm-bindgen-cli $want (had '${have:-none}')"
            cargo install wasm-bindgen-cli --version "$want" --locked
          fi
          make wasm
          test -s site/lib/kira_wasm_bg.wasm

      - name: Fetch release list and notes
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_TAG: ${{ inputs.tag }}
          MAX: ${{ inputs.max_releases }}
        run: |
          set -euo pipefail
          # Stream one object per release and slurp: with --paginate, a --jq that
          # builds an array emits one array PER PAGE, which is not valid JSON.
          #
          # Pre-releases are fetched rather than filtered out here, and narrowed
          # below: an app can ship for the first time in a candidate -- Stopwatch
          # and Timer did, in apps-v1.4.0-rc1 -- and dropping every candidate makes
          # it unreachable until the final lands, which was weeks for 1.2.0.
          gh api --paginate repos/UNAWatch/una-sdk/releases \
            --jq '.[]
                  | select(.tag_name | startswith("apps-v"))
                  | {tag: .tag_name, publishedAt: .published_at, url: .html_url,
                     isPrerelease: .prerelease, notes: .body}' \
            | jq -s 'sort_by(.publishedAt) | reverse' > every-release.json

          # Kira is not an archive of every tag upstream ever pushed. Keep the
          # candidates for the version in flight -- the newest is what gets listed
          # and the rest only lend it their hashes, which is how a watch that took
          # an earlier one is still recognised -- and drop the candidates of every
          # version that already has a full release. Upstream has ~19 of those.
          #
          # Once the release for the version in flight lands, its own candidates
          # fall below the floor and leave on the next build, which is what makes
          # "the stable version displaces the most recent RC" happen by itself.
          python3 - <<'NARROW'
          import json, pathlib, re

          releases = json.loads(pathlib.Path("every-release.json").read_text())

          def version(tag):
              m = re.search(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(int(g) for g in m.groups()) if m else (0, 0, 0)

          finals = [r for r in releases if not r["isPrerelease"]]
          floor = max((version(r["tag"]) for r in finals), default=(0, 0, 0))

          kept, dropped = [], []
          for r in releases:
              # At-or-above, not strictly above: the candidates of the version
              # that has just shipped are still needed for one build, so the
              # release can inherit their hashes before they stop being listed.
              # They cost their hashes, not a catalogue entry.
              if r["isPrerelease"] and version(r["tag"]) < floor:
                  dropped.append(r["tag"])
              else:
                  kept.append(r)

          pathlib.Path("all-releases.json").write_text(json.dumps(kept))
          print(f"newest full release is {'.'.join(map(str, floor))}")
          print(f"{len(kept)} release(s) kept, {len(dropped)} superseded candidate(s) dropped")
          for r in kept:
              if r["isPrerelease"]:
                  print(f"  candidate kept: {r['tag']}")
          NARROW

          if [ -n "$ONLY_TAG" ]; then
            jq --arg t "$ONLY_TAG" '[.[] | select(.tag == $t)]' all-releases.json > releases.json
          elif [ -n "$MAX" ]; then
            jq --argjson n "$MAX" '.[:$n]' all-releases.json > releases.json
          else
            cp all-releases.json releases.json
          fi

          count=$(jq 'length' releases.json)
          if [ "$count" -eq 0 ]; then
            echo "No matching apps-v* releases found." >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.tag)\t\(.publishedAt)"' releases.json

      # registry/README.md tells submitters that a tag can move, so a "pinned"
      # source that can change makes the published recipe a lie -- and then pins
      # UNA's apps to tags. The recipe key hashes the tag string, so if upstream
      # moved one, nothing would rebuild and the catalogue would keep serving a
      # binary whose stated provenance had quietly become false.
      #
      # Changing the recipe to name a commit would invalidate every stored
      # artifact and force a full rebuild, so instead the commit each tag pointed
      # at is recorded once and checked on every build. That does not make the
      # recipe immutable; it makes a move impossible to miss.
      - name: Check the SDK tags still point where they did
        run: |
          set -euo pipefail
          git ls-remote --tags https://github.com/UNAWatch/una-sdk.git 'refs/tags/apps-v*' \
            > upstream-tags.txt
          python3 - <<'CHECK'
          import json, pathlib, sys

          direct, deref = {}, {}
          for line in pathlib.Path("upstream-tags.txt").read_text().splitlines():
              sha, ref = line.split()
              tag = ref.removeprefix("refs/tags/")
              # An annotated tag's own object is not the commit; ^{} is.
              (deref if tag.endswith("^{}") else direct)[tag.removesuffix("^{}")] = sha
          now = {t: deref.get(t, s) for t, s in direct.items()}

          locked = json.loads(pathlib.Path("sdk-tags.lock.json").read_text())
          moved, gone = [], []
          for tag, sha in sorted(locked.items()):
              if tag not in now:
                  gone.append(tag)
              elif now[tag] != sha:
                  moved.append(f"{tag}: locked {sha}, upstream now {now[tag]}")

          # Only the full releases this catalogue publishes from. Candidates are
          # excluded for two reasons, and the second is the load-bearing one.
          #
          # They are noise: upstream carries a -rcN tag for nearly every release.
          # This used to fall out for free because releases.json held no candidates
          # at all; once it did, five notices appeared telling a maintainer to lock
          # tags for builds that are about to be displaced.
          #
          # And following that advice would be a mistake. A locked tag that vanishes
          # upstream is a hard failure below, so locking a candidate takes a
          # permanent dependency on upstream never tidying up an -rcN tag after the
          # release ships. A candidate's provenance is guarded by its hash in the
          # catalogue, which is what a watch is checked against; the lock exists for
          # the tags whose recipes have to stay reproducible forever.
          releases = json.loads(pathlib.Path("releases.json").read_text())
          published = {r["tag"] for r in releases if not r.get("isPrerelease")}
          for tag in sorted((published & set(now)) - set(locked)):
              # A new release has never been built from, so nothing can have moved
              # under it. Recorded on its first build rather than blocking it.
              print(f"::notice::{tag} is not in sdk-tags.lock.json yet; "
                    f'add "{tag}": "{now[tag]}" once it has been built')

          for line in moved + [f"{t}: no longer exists upstream" for t in gone]:
              print(f"::error::{line}")
          if moved or gone:
              print("::error::An SDK tag this catalogue publishes from has changed. Every "
                    "recipe naming it now describes a source tree that is not what was "
                    "built, and the recipe key will not notice. Resolve before publishing.")
              sys.exit(1)
          print(f"{len(locked)} SDK tags unchanged")
          CHECK

      - name: Download the app binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitHub's release-asset endpoint answers 500 to roughly one download
          # in twenty (measured 1/20 on 2026-08-03, against one asset, from two
          # machines). This loop runs once per published tag, so at thirteen tags
          # a single try is a coin flip on the whole build, and `set -e` turned
          # each 500 into a red run -- two Catalogue runs 29 seconds apart, one
          # green one red, with no change in between. Three tries puts it around
          # 1 in 600 builds. The asset is fine; only the request fails.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              # Guarded rather than bare, so a false test is not the loop body's
              # exit status under `set -e`.
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
            done
            return 1
          }

          mkdir -p apps zips
          for tag in $(jq -r '.[].tag' releases.json); do
            mkdir -p "zips/$tag" "apps/$tag"
            retry gh release download "$tag" -R UNAWatch/una-sdk -D "zips/$tag" --clobber
            zip=$(find "zips/$tag" -name '*.zip' | head -n 1)
            if [ -z "$zip" ]; then
              echo "::warning::$tag has no zip asset, skipping"
              rmdir "apps/$tag"; continue
            fi
            unzip -q "$zip" -d "apps/$tag"
            # Older releases may not use the per-app subfolder layout. Skip those
            # rather than letting one odd release fail the whole build; the build
            # tool stays strict about what it does accept.
            if [ -z "$(find "apps/$tag" -mindepth 2 -name '*.uapp' -print -quit)" ]; then
              echo "::warning::$tag has no <Folder>/*.uapp after unzip, skipping"
              rm -rf "apps/$tag"; continue
            fi
            echo "$tag: $(find "apps/$tag" -name '*.uapp' | wc -l | tr -d ' ') apps"
          done
          test -n "$(ls -A apps)" || { echo "No usable releases downloaded." >&2; exit 1; }

      - name: Fetch the binaries Kira has built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p built

          # Retried for the reason given in the step above, but here a failure is
          # worse than a red build: absence is a legitimate answer that sends the
          # whole catalogue back to upstream's binaries, so one 500 would publish
          # every app as the vendor's build and report that as normal. Three
          # tries before believing it.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
            done
            return 1
          }

          # Absent release simply means nothing has been built yet, in which case
          # every version falls back to upstream's binary and says so.
          if retry gh release download "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" -D built --clobber \
               --pattern '*.uapp' 2>/dev/null; then
            echo "$(ls built | wc -l | tr -d ' ') built binaries available"
          else
            echo "no $BINARIES_TAG release; publishing upstream binaries throughout"
          fi

      # What is served right now, which is where a watch got its binary from. The
      # build compares the manifests against it so a published version cannot have
      # its source repointed -- a rule the submission workflow can only check from
      # one pull request's base, and so cannot check at all for anything that
      # reached main another way.
      #
      # Absence is legitimate exactly once, on the first publish of an empty site,
      # and the build says out loud that it checked nothing. Anything else -- a 404
      # from a bad deploy, a transient 500 -- would silently drop the rule, so it is
      # retried and then trusted.
      - name: Fetch the published catalogue
        run: |
          set -euo pipefail
          if curl -fsSL --retry 3 -o published.json \
               https://kira.technicallyrural.com/data/catalog.json; then
            echo "checking against $(jq '.apps | length' published.json) published apps"
          else
            echo "::warning::no published catalogue reachable, so nothing is checked against what is already served"
            rm -f published.json
          fi

      - name: Build the catalogue
        run: |
          set -euo pipefail
          # --registry folds the submitted apps in beside the SDK's, from the same
          # store. It also re-runs the submission checks against the catalogue as
          # it stands now, so a collision upstream introduced later stops the
          # build rather than reaching a watch.
          #
          # --published adds the rules about what a manifest may no longer change,
          # so they hold per publish rather than per review. Its absence is the
          # first-publish case and the build says so; the file is present or it is
          # not, rather than an empty variable spliced into the command line.
          if [ -f published.json ]; then
            cargo run --release -p kira-cli -- build \
              --src apps --out site --releases releases.json \
              --repo UNAWatch/una-sdk --built built \
              --toolchain "$TOOLCHAIN" --registry registry \
              --published published.json
          else
            cargo run --release -p kira-cli -- build \
              --src apps --out site --releases releases.json \
              --repo UNAWatch/una-sdk --built built \
              --toolchain "$TOOLCHAIN" --registry registry
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          echo "Published ${{ needs.build.outputs.releases }} release(s) to ${{ steps.deploy.outputs.page_url }}" \
            >> "$GITHUB_STEP_SUMMARY"
