name: App binaries

# Builds app binaries from source and keeps them on a long-lived release, so the
# catalogue can serve binaries Kira built rather than binaries it was handed.
#
# Not to be confused with the Actions cache under Settings -> Actions -> Caches,
# which holds cargo build caches and nothing to do with app binaries. These live
# as release assets, at releases/tag/app-binaries.
#
# The toolchain container has no Rust, so `kira` is cross-compiled to a static
# musl binary first and carried in. That also means the container job needs no
# toolchain of its own beyond what the image already provides.
#
# By default it walks every published apps-v* release, so the whole history can be
# built in one run rather than one dispatch per tag. Already-stored artifacts are
# skipped, so re-running is cheap.

on:
  # A push to this branch is the practical trigger: dispatching requires admin
  # rights, which not every contributor's token has.
  push:
    branches: [app-binaries]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'A single apps-v* tag, or "all" for every published release'
        required: false
        default: 'all'
      publish:
        description: 'Upload the results (a push to this branch always publishes)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  # Pinned by digest: a re-pushed tag would silently change the output, and the
  # digest is part of every recipe key.
  TOOLCHAIN: xanderhendriks/stm32cubeide:16.0@sha256:7e07c508e3944def22eaabe822eaf902a2ba4fbb38a3ce24d6ff874f9f04c447
  BINARIES_TAG: app-binaries

jobs:
  tool:
    name: Build the kira binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-musl-${{ runner.os }}-

      - name: Cross-compile statically
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          # Static, so it runs inside a container with any libc.
          cargo build --release -p kira-cli --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/kira

      - uses: actions/upload-artifact@v7
        with:
          name: kira-bin
          path: target/x86_64-unknown-linux-musl/release/kira
          retention-days: 1

  build:
    name: Build apps from source
    needs: tool
    runs-on: ubuntu-latest
    container: xanderhendriks/stm32cubeide:16.0@sha256:7e07c508e3944def22eaabe822eaf902a2ba4fbb38a3ce24d6ff874f9f04c447
    steps:
      - name: Install build dependencies
        run: |
          find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's#security\.ubuntu\.com/ubuntu#archive.ubuntu.com/ubuntu#g' {} + || true
          apt-get update
          apt-get install -y bash git python3-full python3-pip python-is-python3 cmake curl jq

      - uses: actions/checkout@v7
        with:
          repository: UNAWatch/una-sdk
          # Full history with tags: the job checks out each release in turn
          # rather than cloning once per tag.
          fetch-depth: 0
          path: sdk

      - name: Install packer requirements
        run: python3 -m pip install --break-system-packages -r sdk/Utilities/Scripts/app_packer/requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: kira-bin
          path: /usr/local/bin

      - name: Prepare the tool and the toolchain
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /usr/local/bin/kira
          kira --version
          # The image ships these unexecutable.
          for tool in make arm-none-eabi-gcc arm-none-eabi-g++ arm-none-eabi-objcopy; do
            chmod +x "$(find /opt/st/stm32cubeide_* -type f -name "$tool" | head -n 1)" || true
          done
          {
            find /opt/st/stm32cubeide_* -type f -name arm-none-eabi-objcopy | head -n 1 | xargs dirname
            find /opt/st/stm32cubeide_* -type f -name make | head -n 1 | xargs dirname
          } >> "$GITHUB_PATH"

      - name: Decide which releases to build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.sdk_ref || 'all' }}
        run: |
          set -euo pipefail
          if [ "$WANTED" != "all" ] && [ -n "$WANTED" ]; then
            echo "$WANTED" > tags.txt
          else
            gh api --paginate repos/UNAWatch/una-sdk/releases \
              --jq '.[] | select(.prerelease == false)
                        | select(.tag_name | startswith("apps-v"))
                        | .tag_name' > tags.txt
          fi
          echo "$(wc -l < tags.txt) release(s) to consider:"
          sed 's/^/  /' tags.txt

      - name: List what the cache already holds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A missing release simply means an empty cache.
          if gh release view "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' > available.txt 2>/dev/null; then
            echo "store holds $(wc -l < available.txt) artifact(s)"
          else
            : > available.txt
            echo "no app-binaries release yet; treating the store as empty"
          fi

      - name: Build every release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > failures.txt
          : > built.txt

          while read -r tag; do
            [ -n "$tag" ] || continue
            # The version stamped into a release's binaries is the one in its tag;
            # apps-v0.1.9-rc3 stamps 0.1.9. It has to match, because the version is
            # part of the recipe and therefore of the artifact name.
            version=$(printf '%s' "$tag" | sed -E 's/^apps-v//; s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

            echo "::group::$tag (stamping $version)"
            # Untracked build directories from the previous tag would otherwise
            # accumulate and feed cmake stale cached paths.
            git -C sdk checkout -q --detach "$tag"
            git -C sdk clean -xdfq

            kira cache-plan \
              --sdk sdk --sdk-rev "$tag" --version "$version" \
              --toolchain "$TOOLCHAIN" --available available.txt --out plan.json

            # stdin is redirected per command below: anything the build spawns
            # would otherwise read from this pipe and eat the remaining app list.
            jq -r '.[] | select(.action == "build") | "\(.folder)\t\(.asset)"' plan.json |
            while IFS=$'\t' read -r folder asset; do
              # One app failing must not abandon the rest: these are historical
              # releases and some may simply not build with today's recipe. Every
              # failure is listed at the end, and anything missing shows up in the
              # catalogue as an upstream binary rather than silently as Kira's.
              if kira build-app \
                   --app "sdk/Examples/Apps/$folder" \
                   --sdk sdk \
                   --version "$version" \
                   --out "artifacts/$asset" \
                   --toolchain "$TOOLCHAIN" \
                   --sdk-rev "$tag" \
                   --app-source "sdk:$tag:Examples/Apps/$folder" \
                   < /dev/null; then
                echo "$tag/$folder" >> built.txt
              else
                echo "$tag/$folder" >> failures.txt
                echo "::warning::$tag/$folder failed to build"
              fi
            done
            echo "::endgroup::"
          done < tags.txt

          echo "built $(wc -l < built.txt) binaries, $(wc -l < failures.txt) failed"

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          # Written unconditionally: a fully cached run builds nothing, and an
          # empty upload would leave the publish job with no artifact to fetch.
          {
            echo "sdk_ref=${{ inputs.sdk_ref || 'apps-v1.3.0' }}"
            echo "version=${{ inputs.version || '1.3.0' }}"
            echo "toolchain=$TOOLCHAIN"
            echo "built=$(ls artifacts/*.uapp 2>/dev/null | wc -l | tr -d ' ')"
          } > artifacts/MANIFEST.txt
          {
            echo "### App binaries"
            echo
            echo "Built **$(wc -l < built.txt)** binaries across $(wc -l < tags.txt) release(s)."
            if [ -s failures.txt ]; then
              echo
              echo "#### Failed to build"
              echo
              sed 's/^/- /' failures.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: built-uapps
          # The whole directory, so MANIFEST.txt guarantees the artifact exists
          # even when nothing needed building.
          path: artifacts/
          if-no-files-found: error
          # Redundant once uploaded to the release; no need to keep it 90 days.
          retention-days: 7

  publish:
    name: Upload to the app-binaries release
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: built-uapps
          path: artifacts

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat artifacts/MANIFEST.txt

          shopt -s nullglob
          built=(artifacts/*.uapp)
          if [ ${#built[@]} -eq 0 ]; then
            echo "nothing new to upload; every binary was already stored"
            exit 0
          fi

          # One long-lived release acting as a content-addressed store. Artifacts
          # are named by recipe, so uploads never need to replace anything.
          if ! gh release view "$BINARIES_TAG" >/dev/null 2>&1; then
            gh release create "$BINARIES_TAG" \
              --title "App binaries" \
              --notes "Binaries Kira built from source, named by recipe key. A store for the build pipeline, not a user-facing release." \
              --latest=false
          fi
          gh release upload "$BINARIES_TAG" "${built[@]}" --clobber
          echo "store now holds $(gh release view "$BINARIES_TAG" --json assets --jq '.assets | length') artifact(s)"
