name: Submissions

# Checks a third-party app submission and proves it builds, on the pull request
# that adds it.
#
# `pull_request`, deliberately not `pull_request_target`: this job checks out and
# compiles code from a contributor's repository, so it must run with no secrets
# and no write token. Nothing here publishes; a merge to main is what does that.
on:
  pull_request:
    paths:
      - "registry/**"
      - ".github/workflows/registry.yml"
  # And again after merge: the pull-request run gates a contributor's code, and
  # this one is where publishing happens. A run on main uploads what it built to
  # the app-binaries store, which is where the catalogue build then finds it.
  #
  # It re-checks the history too, against `github.event.before`. It used to resolve
  # that base to the tip it was running on, so the comparison was main against
  # itself and the immutability rules passed without testing anything -- which is
  # why they are now also checked at catalogue build, against what is actually
  # served. Neither run is the only thing standing between a repointed recipe and a
  # publish.
  push:
    branches: [main]
    paths:
      - "registry/**"
      - ".github/workflows/registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  # Pinned by digest, so a submission builds under the same compiler as
  # everything else in the catalogue. Keep in step with app-binaries.yml.
  TOOLCHAIN: ghcr.io/tobymurray/kira-toolchain@sha256:4d75a70b33b4c4fb8799bed5af2ebb03c9b6eb161ffed3049e316ad996461127
  BINARIES_TAG: app-binaries

jobs:
  check:
    name: Check the manifests
    runs-on: ubuntu-latest
    outputs:
      # Lets the build job be skipped entirely when a run touches the docs or
      # this workflow rather than a manifest, and when every wanted artifact is
      # already in the store.
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v7

      # Which commit to compare against, to catch a published version being
      # repointed at different source.
      #
      # Deliberately not `github.ref`: on a push that resolves to the tip that was
      # just pushed, so the comparison was main against itself and every rule
      # passed vacuously. `github.event.before` is what main was at beforehand,
      # which is the only value that makes the comparison mean anything.
      #
      # A force-push or a first push has no predecessor, and the null sha is not
      # checkoutable. That is not fatal: the catalogue build checks the same rules
      # against the catalogue it is actually serving, which needs no git history.
      # So skip, and say so, rather than fail a legitimate force-push.
      - name: Resolve the comparison base
        id: base
        run: |
          sha='${{ github.event.pull_request.base.sha || github.event.before }}'
          case "$sha" in
            '' | 0000000000000000000000000000000000000000)
              echo "::warning::no predecessor commit for this event, so the \
          history check is skipped; the catalogue build still checks the published \
          catalogue"
              sha=''
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.base.outputs.sha != ''
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-musl-${{ runner.os }}-

      # The live catalogue is the authoritative list of identities already in use,
      # and it is not in the repository: site/data is generated.
      - name: Fetch the published catalogue
        run: |
          curl -fsSL --retry 3 -o catalog.json \
            https://kira.technicallyrural.com/data/catalog.json
          echo "$(jq '.apps | length' catalog.json) apps already published"

      - name: Cross-compile the tool statically
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          # Static, because the build job runs inside a container that has no
          # Rust at all and an older libc than this runner.
          cargo build --release -p kira-cli --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/kira
          echo "KIRA=$PWD/target/x86_64-unknown-linux-musl/release/kira" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: kira-bin
          path: target/x86_64-unknown-linux-musl/release/kira
          retention-days: 1

      - name: Validate
        run: |
          set -euo pipefail
          # --base only when there is a predecessor to compare against; see the
          # step that resolved it. Spelled out twice rather than built up in an
          # array, because an empty array under `set -u` is not portable and the
          # empty case is exactly the one that must not break.
          if [ -d base/registry ]; then
            "$KIRA" registry validate \
              --dir registry \
              --base base/registry \
              --catalog catalog.json
          else
            "$KIRA" registry validate \
              --dir registry \
              --catalog catalog.json
          fi

      # Artifacts are named by recipe, so anything already stored is by
      # construction the binary that recipe produces. Re-running is then cheap,
      # and a re-merge does not rebuild the whole registry.
      - name: Read what the store already holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An absent release means an empty store. Any other failure lands here
          # too and causes a rebuild -- wasteful, never wrong.
          if gh release view "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' > available.txt 2>/dev/null; then
            echo "store holds $(wc -l < available.txt) artifact(s)"
          else
            : > available.txt
            echo "no $BINARIES_TAG release yet; treating the store as empty"
          fi

      - name: Plan what has to be built
        id: plan
        run: |
          set -euo pipefail
          "$KIRA" registry plan \
            --dir registry --toolchain "$TOOLCHAIN" \
            --available available.txt --out plan.json
          jq -r '.[] | "\(.action)\t\(.folder) \(.version) \(.appSource)"' plan.json
          echo "builds=$(jq '[.[] | select(.action == "build")] | length' plan.json)" \
            >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: submission-plan
          path: plan.json
          if-no-files-found: error

  build:
    name: Build every submitted version
    needs: check
    if: needs.check.outputs.builds != '0'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tobymurray/kira-toolchain@sha256:4d75a70b33b4c4fb8799bed5af2ebb03c9b6eb161ffed3049e316ad996461127
      # A package published to GHCR starts private. Public is the better end
      # state -- an image nobody else can pull makes the reproducibility claim
      # unverifiable from outside -- but authenticating costs nothing and keeps
      # this working either way.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install build dependencies
        run: |
          find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's#security\.ubuntu\.com/ubuntu#archive.ubuntu.com/ubuntu#g' {} + || true
          apt-get update
          apt-get install -y bash git python3-full python3-pip python-is-python3 cmake curl jq

      - uses: actions/checkout@v7
        with:
          repository: UNAWatch/una-sdk
          # Tags included: each submission names the SDK revision to build with.
          fetch-depth: 0
          path: sdk

      - name: Install packer requirements
        run: python3 -m pip install --break-system-packages -r sdk/Utilities/Scripts/app_packer/requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: kira-bin
          path: /usr/local/bin

      - name: Check the tool runs here
        run: |
          chmod +x /usr/local/bin/kira
          kira --version

      - name: Prepare the toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The image ships these unexecutable.
          for tool in make arm-none-eabi-gcc arm-none-eabi-g++ arm-none-eabi-objcopy; do
            chmod +x "$(find /opt/st/stm32cubeide_* -type f -name "$tool" | head -n 1)" || true
          done
          {
            find /opt/st/stm32cubeide_* -type f -name arm-none-eabi-objcopy | head -n 1 | xargs dirname
            find /opt/st/stm32cubeide_* -type f -name make | head -n 1 | xargs dirname
          } >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: submission-plan

      - name: Build each version from its pinned commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          failed=0
          # Only what the plan says is missing: anything already in the store was
          # built from this exact recipe, so rebuilding it would prove nothing.
          jq -c '.[] | select(.action == "build")' plan.json > items.txt
          while read -r item; do
            folder=$(jq -r '.folder' <<<"$item")
            version=$(jq -r '.version' <<<"$item")
            asset=$(jq -r '.asset' <<<"$item")
            sdk_rev=$(jq -r '.sdkRev' <<<"$item")
            app_source=$(jq -r '.appSource' <<<"$item")

            # git:<url>@<40-hex sha>:<subdir>
            rest=${app_source#git:}
            url=${rest%@*}
            rest=${rest##*@}
            rev=${rest%%:*}
            subdir=${rest#*:}

            echo "::group::$folder $version from ${rev:0:12}"
            rm -rf src
            mkdir src
            # Fetch exactly the commit named, so a moved branch or tag cannot
            # change what gets built.
            git -C src init -q
            git -C src remote add origin "$url"
            if ! git -C src fetch -q --depth 1 origin "$rev"; then
              echo "::error::$folder $version: commit $rev is not in $url"
              failed=$((failed + 1)); echo "::endgroup::"; continue
            fi
            git -C src checkout -q FETCH_HEAD

            # Detached, and cleaned between builds: the tree is reused across
            # versions that name different SDK revisions.
            if ! git -C sdk checkout -q --detach "$sdk_rev"; then
              echo "::error::$folder $version: SDK revision $sdk_rev not found"
              failed=$((failed + 1)); echo "::endgroup::"; continue
            fi
            git -C sdk clean -xdfq

            # build-app verifies the result against what the source declares:
            # AppID, type, version and the .uapp's own CRC.
            if kira build-app \
                 --app "src/$subdir" \
                 --sdk sdk \
                 --version "$version" \
                 --out "artifacts/$asset" \
                 --toolchain "$TOOLCHAIN" \
                 --app-source "$app_source" \
                 --sdk-rev "$sdk_rev" < /dev/null; then
              kira inspect "artifacts/$asset"
            else
              echo "::error::$folder $version: build or verification failed"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < items.txt

          echo "built $(ls artifacts | wc -l) binaries, $failed failed"
          [ "$failed" -eq 0 ]

      - name: Report what was built
        if: always()
        shell: bash
        run: |
          {
            echo "### Submitted binaries"
            echo
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Uploaded to the \`app-binaries\` store, where the catalogue build picks them up."
            else
              echo "Built here for checking only — a pull request never publishes."
            fi
            echo
            for file in artifacts/*.uapp; do
              [ -e "$file" ] || continue
              echo "- \`$(basename "$file")\` — $(stat -c%s "$file") bytes, sha256 $(sha256sum "$file" | cut -c1-16)…"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: submitted-uapps
          path: artifacts
          if-no-files-found: error

  publish:
    name: Upload to the app-binaries store
    needs: [check, build]
    # Merging to main is what publishes; a pull request builds and stops.
    if: github.event_name == 'push' && needs.check.outputs.builds != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance attestation below. The identity comes from the
      # workflow's OIDC token, which is why it cannot be forged by whatever the
      # submitted CMakeLists did in the build job.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: submitted-uapps
          path: artifacts

      # The plan is the only trustworthy statement of what this run was allowed
      # to produce: it is computed from the manifests before any submitted code
      # runs. Everything below is checked against it.
      - uses: actions/download-artifact@v8
        with:
          name: submission-plan

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The build job runs the submitter's own CMakeLists -- arbitrary code,
          # deliberately unreviewed, as root in the container that also holds
          # artifacts/. So the directory listing is a statement by that code, not
          # by Kira, and uploading it wholesale let a submission write any name it
          # liked into the store: one extra file called
          # Alarm-1.3.0-<known recipe key>.uapp and the catalogue would serve it
          # as UNA's Alarm, "built by Kira from source", past every hash check,
          # because the hash is taken from whatever is stored.
          #
          # So: upload the names the plan asked for, and nothing else.
          jq -r '.[] | select(.action == "build") | .asset' plan.json | sort -u > wanted.txt
          (cd artifacts && ls -1 -- *.uapp 2>/dev/null || true) | sort -u > produced.txt

          stray=$(comm -13 wanted.txt produced.txt)
          if [ -n "$stray" ]; then
            echo "::error::the build produced .uapp files no recipe asked for; refusing to publish"
            printf '::error::  unexpected: %s\n' $stray
            exit 1
          fi

          if ! gh release view "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" \
              --title "App binaries" \
              --notes "Binaries Kira built from source, named by recipe key. A store for the build pipeline, not a user-facing release." \
              --latest=false
          fi
          gh release view "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort -u > stored.txt

          # GitHub's release-asset endpoint 500s on roughly one download in
          # twenty. Failing here would abandon a merged submission halfway
          # through publishing it, for no reason but bad luck.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
            done
            return 1
          }

          mkdir -p stored
          uploaded=0 skipped=0
          while read -r asset; do
            [ -n "$asset" ] || continue
            path="artifacts/$asset"
            if [ ! -f "$path" ]; then
              echo "::error::$asset was planned but the build did not produce it"
              exit 1
            fi

            # A recipe key names one set of bytes. If the store already holds this
            # name the only acceptable outcome is that it is the same file, so a
            # re-run stays idempotent -- and --clobber never appears, because the
            # case it silently handled is the case worth failing on.
            if grep -qxF -- "$asset" stored.txt; then
              retry gh release download "$BINARIES_TAG" -R "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir stored --clobber
              if cmp -s -- "stored/$asset" "$path"; then
                echo "  = $asset already stored, byte-identical"
                skipped=$((skipped + 1))
                continue
              fi
              echo "::error::$asset is already stored with different bytes"
              echo "::error::two binaries are claiming one recipe; refusing to overwrite"
              exit 1
            fi

            gh release upload "$BINARIES_TAG" "$path" -R "$GITHUB_REPOSITORY"
            uploaded=$((uploaded + 1))
          done < wanted.txt

          {
            echo "### Published"
            echo
            echo "$uploaded uploaded, $skipped already stored and identical."
            echo
            sed 's/^/- `/; s/$/`/' wanted.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # Signed by GitHub's OIDC identity for this workflow, so it does not live in
      # the repository it describes -- which is the gap README.md names when it
      # says the hashes sit alongside the artifacts they vouch for. Anyone can
      # check a stored binary really came out of this workflow, from this commit:
      #
      #   gh attestation verify <file.uapp> --repo tobymurray/kira
      #
      # The upload step has already refused anything the plan did not ask for, so
      # by here artifacts/ holds exactly the recipes' own output.
      - name: Attest what was published
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*.uapp'
